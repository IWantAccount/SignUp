spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.enabled=false
spring.mvc.servlet.path=/api

storage.location=${SPRING_UPLOADS}
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=10MB
video.max-size=200MB
video.allowed-types=.mp4,.webm

jwt.secret=${JWT_SECRET}
jwt.valid-in-minutes=${JWT_VALID_MINUTES}

init-user.email=${INIT_EMAIL}
init-user.name=${INIT_NAME}
init-user.password=${INIT_PASSWORD}
init-user.enabled=${INIT_ENABLED}

spring.security.user.name=user
spring.security.user.password=plsdonthackme
server.forward-headers-strategy=framework

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_ADDR}
spring.mail.password=${MAIL_PASSWD}
mail.email-source=${MAIL_SOURCE_ADDR}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
web-origin.web-address=${WEB_ORIGIN}

origins.allowed: ${ALLOWED_ORIGINS}